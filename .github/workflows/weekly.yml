name: PSI Radar - Weekly Collect and Deploy
on:
  workflow_dispatch:
  schedule:
    # Monday 06:00 KST = Sunday 21:00 UTC
    - cron: '0 21 * * 0'
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: psi-radar
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate manufacturer benchmark evidence
        run: python -m scripts.validate_benchmark
      - name: Build benchmark change history
        run: python -m scripts.benchmark_history
      - name: Build device architecture overview
        run: python -m scripts.architecture
      - name: Validate dashboard JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('site/index.html').read_text(); Path('/tmp/psi-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/psi-ui.js
      - name: Collect public research metadata
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.collect
      - name: AI translation and summary (budget controlled)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          PSI_AI_MAX_CALLS: ${{ github.event_name == 'push' && '0' || '12' }}
          PSI_AI_INPUT_TOKEN_BUDGET: "12000"
          PSI_AI_OUTPUT_TOKEN_BUDGET: "3600"
          PSI_AI_MAX_ESTIMATED_USD: "0.02"
        run: python scripts/ai_enrich.py
      - name: Generate topic-to-evidence index
        run: python -m scripts.tech_topics
      - name: Generate weekly topic trend snapshots
        run: python -m scripts.topic_trends
      - name: Generate priority technology briefing
        run: python -m scripts.briefing
      - name: Generate weekly archive and report index
        run: python -m scripts.weekly_report
      - name: Persist latest successful data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/reports/ site/benchmark_history/ site/topic_map.json site/topic_trends/ site/briefing.json
          git diff --cached --quiet || (git commit -m 'data: update weekly metadata' && git pull --rebase origin main && git push)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Allow GitHub artifact metadata to propagate
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4

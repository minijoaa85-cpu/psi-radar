name: PSI Radar - Daily Official IR Check
on:
  workflow_dispatch:
  schedule:
    # 08:30 KST = 23:30 UTC previous day
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: psi-radar-daily-finance-ir
  cancel-in-progress: false

jobs:
  scan-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate verified metrics separately from announcements
        run: python -m scripts.validate_financials
      - name: Monitor four official IR announcement listings
        run: python -m scripts.financial_ir_watch
      - name: Commit observation metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/financial_ir_watch.json
          git diff --cached --quiet || (git commit -m 'data: daily official IR candidate observations' && git pull --rebase origin main && git push)

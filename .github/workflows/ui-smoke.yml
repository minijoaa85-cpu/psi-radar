name: PSI Radar - Cross-Browser UI Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/integrated.json
      - site/financials.json
      - scripts/validate_financials.py
      - scripts/financial_ir_watch.py
      - site/financial_ir_watch.json
      - tests/browser_smoke.py
      - .github/workflows/ui-smoke.yml

permissions:
  contents: read

concurrency:
  group: psi-radar-ui-smoke
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the same static data assets as Pages deployment
        run: |
          pip install -r requirements.txt
          python -m scripts.validate_financials
          python -m scripts.financial_ir_watch
          python -m scripts.architecture
          python -m scripts.tech_topics
          python -m scripts.briefing
          python -m scripts.integrated
      - name: Generate PDF and PPT history artifacts for UI download tests
        run: |
          pip install python-pptx reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m scripts.build_history_slides
          test -s site/docs/psi-radar-version-history.pdf
          test -s site/docs/psi-radar-version-history.pptx
      - name: Install Playwright and Chromium / Firefox / WebKit
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Check PC tablet and mobile navigation with real browser engines
        run: python tests/browser_smoke.py
      - name: Save screenshots if any browser check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failure-screenshots
          path: ui-smoke-screenshots/
          if-no-files-found: ignore
